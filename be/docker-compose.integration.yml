services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticket_booking_test
      POSTGRES_USER: ticket_booking_test
      POSTGRES_PASSWORD: ticket_booking_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket_booking_test -d ticket_booking_test']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
