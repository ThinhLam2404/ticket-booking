services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticket_booking_test
      POSTGRES_USER: ticket_booking_test
      POSTGRES_PASSWORD: ticket_booking_test
    ports:
      - '127.0.0.1:${INTEGRATION_POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket_booking_test -d ticket_booking_test']
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - '127.0.0.1:${INTEGRATION_SMTP_PORT:-55025}:1025'
      - '127.0.0.1:${INTEGRATION_SMTP_API_PORT:-58025}:8025'
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - '127.0.0.1:${INTEGRATION_REDIS_PORT:-56379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
