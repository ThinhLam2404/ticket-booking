services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticket_booking_ops_source
      POSTGRES_USER: ticket_booking_ops
      POSTGRES_PASSWORD: ticket_booking_ops
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ticket_booking_ops -d ticket_booking_ops_source',
        ]
      interval: 2s
      timeout: 3s
      retries: 20
