services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - app_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: be/Dockerfile
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:8080}
      PUBLIC_APP_URL: ${DOCKER_PUBLIC_APP_URL:-http://localhost:8080}
      SWAGGER_ENABLED: 'false'
      TRUST_PROXY: '1'
      MAIL_WORKER_ENABLED: ${DOCKER_MAIL_WORKER_ENABLED:-false}
    networks:
      - edge
      - backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/v1/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    networks:
      - edge
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  app_redis_data:

networks:
  edge:
  backend:
    internal: true
